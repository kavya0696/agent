<!DOCTYPE html>
<html>

<head>
    <title>Nova AI</title>
</head>

<style>
   body{
       margin:0;
       height:100vh;
       display:grid;
       place-items:center;
       background:#09090b;
       color:white;
       font-family:Arial;
    }

    .card{
        width:300px;
        padding:35px;
        text-align:center;
        background: #151518;
        border-radius:50%;
        font-size:35px;
        cursor: pointer;
    }
    .mic{
       width:90px;
       height:90px;
       border:0;
       border-radius:50%;
       font-size:35px;
       cursor:pointer;
    }

   .status{
        margin-top:20px;
        color:#aaa;
  }
  .song{
     margin-top:10px;
     font-size:13px;
 }
  .listening{
         transform:scale(1.1);
         box-shadow:0 0 0 10px #ffffff18;
 }
</style>
    
<body>
    
<div class="card">
<h2>Nova AI</h2>
<p>Say a song name</p>

<button id="mic" class="mic">
</button>
<div id="status" class="status">
Tap microphone
</div> 
</div>
    
</body>

</html>
